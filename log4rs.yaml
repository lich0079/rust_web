refresh_rate: 30 seconds

appenders:
  stdout:
    kind: console

  requests:
    kind: file
    path: "log/requests.log"
    encoder:
      pattern: "{d} - {m}{n}"

  roll:
    kind: rolling_file
    path: "log/roll.log"
    encoder:
      pattern: "{d} - {m}{n}"
    policy:
      kind: compound
      trigger:
        kind: size
        limit: 100 mb
      roller:
        kind: delete

root:
  level: info
  appenders:
    - stdout

loggers:
  app::backend::db:
    level: info

  rust_web::app:
    level: info
    appenders:
      - roll
    additive: false