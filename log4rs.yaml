refresh_rate: 30 seconds

appenders:
  stdout:
    kind: console

  system:
    kind: file
    path: "log/system.log"
    encoder:
      pattern: "{d(%Y-%m-%dT%H:%M:%S%.6f)} {M} {m}{n}"

  roll:
    kind: rolling_file
    path: "log/roll.log"
    encoder:
      pattern: "{d(%Y-%m-%dT%H:%M:%S%.6f)} {M} {m}{n}"
    policy:
      kind: compound
      trigger:
        kind: size
        limit: 100 mb
      roller:
        kind: delete

root:
  level: info
  appenders:
    - stdout

loggers:
  app::backend::db:
    level: info

  rust_web::app:
    level: info
    appenders:
      - stdout
    additive: false