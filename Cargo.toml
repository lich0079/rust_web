[package]
name = "rust_web"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4.4.0"
prometheus = "0.13.3"
actix-web-prom = "0.7.0"
systemstat = "0.2.3"
dashmap = "5.5.3"
log = "0.4.20"
log4rs = "1.2.0"
once_cell = "1.18.0"
crypto-botters = { version = "0.6.0", features = ["binance", "bitflyer", "bybit", "coincheck"] }
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"
serde_urlencoded = { version = "0.7.1", optional = true }
rust_decimal = { version = "1.33.0", features = ["serde-with-str", "serde-with-float"] }
tokio = "1.36.0"
crossbeam = "0.8.4"
futures = "0.3.30"